<!--
  TMA — English homepage, host-fetched from assets/homepage/homepage_en.html.

  This fills the area BELOW the native search banner; the banner itself (heading, search
  box, background) stays the host's and is styled from custom.css. Reached only while the
  Back Office Landing Page "Enable configuration" box is UNCHECKED — tick it and the host
  serves its own landing page from assets/landingpage/landingpage.json instead and never
  requests this file.

  Styling lives in the sibling homepage.css, which the host fetches alongside this file.

  Each card opens its own search tab and scope — TRADEMARK and PATENT, both Back Office
  config (links switched 2026-10-05) — replacing the original single TMA scope narrowed by a resource-type
  filter. Both search "application", the same query the classic cards used: every record is
  an application, so it returns each whole registry.

  Note the hrefs carry vid=972TAU_INST:TMA_NDE. Primo refuses a search URL without a vid
  ("Failed to load view configuration"), so it cannot be omitted, and this file is copied
  verbatim rather than templated. custom.js rewrites the vid at runtime from the view the
  page is actually being served in, which is what keeps these links working when the view
  is promoted from TMA_NDE to TMA. The hardcoded value is the fallback if that script
  never runs.

  Why the card images are CSS backgrounds and not <img>: this file is fetched from
  assets/homepage/ but INJECTED into the page at /nde/home, and a relative src in injected
  markup resolves against the page URL, not against the file it came from. ../images/x.jpg
  became /images/x.jpg and 404'd — visible as two broken-image icons on the first upload.
  An absolute path would fix it but would hardcode the package name, and therefore the view,
  right back into a file whose whole point is not to name one. A stylesheet resolves its own
  relative URLs against itself, so homepage.css reaches ../images/ correctly and the problem
  disappears. The images are decorative — the heading carries the meaning — so nothing is
  lost by moving them out of the DOM.
-->
<div class="tma-home">
  <ul class="tma-cards">
    <li>
      <a class="tma-card"
         href="/nde/search?query=application&amp;tab=TRADEMARK&amp;search_scope=TRADEMARK&amp;classify=true&amp;lang=en&amp;vid=972TAU_INST:TMA_NDE">
        <h2 class="tma-card__title">
          The Reconstructed Trademark Registry of Mandate Palestine <span class="tma-card__dates">(1922-1948)</span>
        </h2>
        <span class="tma-card__image tma-card__image--trademarks"
              role="presentation"></span>
      </a>
    </li>

    <li>
      <a class="tma-card"
         href="/nde/search?query=application&amp;tab=PATENT&amp;search_scope=PATENT&amp;classify=true&amp;lang=en&amp;vid=972TAU_INST:TMA_NDE">
        <h2 class="tma-card__title">
          The Reconstructed Patent Registry of Mandate Palestine <span class="tma-card__dates">(1924-1948)</span>
        </h2>
        <span class="tma-card__image tma-card__image--patents"
              role="presentation"></span>
      </a>
    </li>
  </ul>
</div>
