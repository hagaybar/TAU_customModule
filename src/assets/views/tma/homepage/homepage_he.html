<!--
  TMA — Hebrew homepage, host-fetched from assets/homepage/homepage_he.html.

  The content below is the English text, deliberately. Hila's instruction is that this view
  is English-only, and the language selector is hidden from the header (see custom.css), so
  in practice nobody reaches this file through the interface — but ?lang=he in a URL still
  switches, and a stub or a probe marker would be a broken page for anyone who lands here
  from an old link. Working English beats invented Hebrew: the card titles are the
  registry's formal scholarly names, and guessing at their Hebrew would be worse than
  showing the real ones.

  Replace with real Hebrew copy if the view ever becomes bilingual. The links below already
  carry lang=he, so only the visible text needs changing.

  Everything else about this file — the layout, the vid rewriting in custom.js, why the
  banner is not ours — is documented in homepage_en.html.
-->
<div class="tma-home">
  <ul class="tma-cards">
    <li>
      <a class="tma-card"
         href="/nde/search?query=application&amp;tab=TMA&amp;search_scope=TMA&amp;pfilter=rtype,exact,TRADEMARK&amp;offset=0&amp;mode=resourceTypeFilterBar&amp;lang=he&amp;vid=972TAU_INST:TMA_NDE">
        <h2 class="tma-card__title">
          The Reconstructed Trademark Registry of Mandate Palestine (1922&#8211;1948)
        </h2>
        <img class="tma-card__image"
             src="../images/tma-trademarks-grid.jpg"
             alt=""
             width="1157" height="609" loading="lazy" decoding="async">
        <span class="tma-card__cue">Browse the trademarks</span>
      </a>
    </li>

    <li>
      <a class="tma-card"
         href="/nde/search?query=application&amp;tab=TMA&amp;search_scope=TMA&amp;pfilter=rtype,exact,PATENT&amp;offset=0&amp;mode=resourceTypeFilterBar&amp;lang=he&amp;vid=972TAU_INST:TMA_NDE">

        <img class="tma-card__image"

        <span class="tma-card__cue">Browse the patents</span>
      </a>
    </li>
  </ul>
</div>
