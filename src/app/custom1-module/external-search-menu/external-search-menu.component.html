<div class="tau-xsearch" [attr.dir]="textDirection" *ngIf="hasSearchQuery()">
  <button
    #trigger
    type="button"
    class="tau-xsearch__trigger"
    [class.tau-xsearch__trigger--open]="isOpen"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen"
    aria-controls="tau-xsearch-menu"
    [attr.aria-label]="buttonLabel"
    [attr.title]="buttonLabel"
    (click)="toggle()">
    <!-- Material Symbols "travel_explore" (Apache 2.0) -->
    <svg viewBox="0 -960 960 960" width="24" height="24" fill="currentColor" aria-hidden="true">
      <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q146 0 255.5 91.5T872-559h-82q-19-73-68.5-130.5T600-776v16q0 33-23.5 56.5T520-680h-80v80q0 17-11.5 28.5T400-560h-80v80h80v120h-40L168-552q-3 18-5.5 36t-2.5 36q0 131 92 225t228 95v80Zm364-20L716-228q-21 12-45 20t-51 8q-75 0-127.5-52.5T440-380q0-75 52.5-127.5T620-560q75 0 127.5 52.5T800-380q0 27-8 51t-20 45l128 128-56 56ZM620-280q42 0 71-29t29-71q0-42-29-71t-71-29q-42 0-71 29t-29 71q0 42 29 71t71 29Z"/>
    </svg>
  </button>

  <div
    #menu
    *ngIf="isOpen"
    id="tau-xsearch-menu"
    class="tau-xsearch__menu"
    role="menu"
    [attr.aria-label]="buttonLabel"
    [style.top.px]="menuTop"
    [style.left.px]="textDirection === 'ltr' ? menuInlineStart : null"
    [style.right.px]="textDirection === 'rtl' ? menuInlineStart : null"
    (keydown)="onMenuKeydown($event)">
    <a
      *ngFor="let source of externalSources"
      role="menuitem"
      class="tau-xsearch__item"
      [href]="buildExternalUrl(source)"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="getLinkLabel(source)"
      (click)="close()">
      <img autoAssetSrc [src]="source.img" alt="" class="tau-xsearch__icon" width="16" height="16">
      <span class="tau-xsearch__name">{{ getSourceName(source) }}</span>
    </a>
  </div>
</div>
